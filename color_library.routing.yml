entity.color.add_form:
  path: '/admin/structure/colors/add'
  defaults:
    _entity_form: 'color.add'
    _title: 'Add Color'
  requirements:
    _permission: 'administer colors'

entity.color.edit_form:
  path: '/admin/structure/colors/{color}/edit'
  defaults:
    _entity_form: 'color.edit'
    _title: 'Edit Color'
  requirements:
    _permission: 'administer colors'

entity.color.delete_form:
  path: '/admin/structure/colors/{color}/delete'
  defaults:
    _entity_form: 'color.delete'
    _title: 'Delete Color'
  requirements:
    _permission: 'administer colors'

entity.color.collection:
  path: '/admin/structure/colors'
  defaults:
    #   _controller: '\Drupal\Core\Entity\Controller\EntityListController::listing'
    _title: 'Colors'
  requirements:
    _permission: 'administer colors'

color_library.ui:
  path: '/color-library'
  defaults:
    _controller: '\Drupal\color_library\Controller\ColorLibraryController::view'
    _title: 'Color library'
  requirements:
    _permission: 'access color library'

